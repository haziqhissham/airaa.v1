# Supabase local development config (supabase CLI).
# Run: supabase start  → local Postgres + Auth + Storage on the ports below.

project_id = "ai-readiness-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# NOTE: These settings apply ONLY to the local Supabase CLI (`supabase start`).
# The HOSTED project's redirect behaviour is controlled in the Supabase
# Dashboard → Authentication → URL Configuration (Site URL + Redirect URLs).
# Keep the two in sync — update the dashboard for production/preview domains.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://airaa-v1.vercel.app/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# OAuth providers (fill secrets via env when enabling)
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"

[auth.external.azure]
enabled = false
client_id = "env(AZURE_OAUTH_CLIENT_ID)"
secret = "env(AZURE_OAUTH_SECRET)"

[storage]
enabled = true
file_size_limit = "50MiB"
